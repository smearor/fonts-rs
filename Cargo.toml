[workspace]
members = [
    "crates/fonts-rs-model",
    "crates/fonts-rs-generator",
    "crates/fonts-rs-seven-segment",
    "crates/fonts-rs-fourteen-segment",
    "crates/nerd-fonts-model",
    "crates/nerd-fonts-generator",
    "crates/nerd-fonts-rs",
    "crates/nerd-fonts-cheat-sheet",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/fonts-rs"
homepage = "https://github.com/smearor/fonts-rs"
keywords = ["gtk4", "nerd-fonts", "icons", "font", "rendering"]
categories = ["graphics", "gui", "rendering"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(is_lib)'] }

[workspace.dependencies]
# Internal crates
fonts-rs-model = { version = "0.1.0", path = "crates/fonts-rs-model" }
fonts-rs-generator = { version = "0.1.0", path = "crates/fonts-rs-generator" }
fonts-rs-seven-segment = { version = "0.1.0", path = "crates/fonts-rs-seven-segment" }
fonts-rs-fourteen-segment = { version = "0.1.0", path = "crates/fonts-rs-fourteen-segment" }
nerd-fonts-model = { version = "0.1.0", path = "crates/nerd-fonts-model" }
nerd-fonts-generator = { version = "0.1.0", path = "crates/nerd-fonts-generator" }
nerd-fonts-rs = { version = "0.1.0", path = "crates/nerd-fonts-rs" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.42", features = ["serialize"] }

# Compile-time string formatting
const_format = "0.2"

# Error handling
thiserror = "2.0"
miette = "7.6"

# Font parsing
skrifa = "0.47"
read-fonts = "0.44"
font-types = "0.12"
ab_glyph = "0.2"
woff2-patched = "0.4"

# GTK4 ecosystem
gtk4 = "0.11"
gio = "0.22"
glib = "0.22"
glib-build-tools = "0.22"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Code generation
phf = { version = "0.14", features = ["macros"] }

# Logging
tracing = "0.1"
