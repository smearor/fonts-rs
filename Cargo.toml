[workspace]
members = [
    "crates/fonts-rs-model",
    "crates/fonts-rs-generator",
    "crates/fonts-rs-seven-segment",
    "crates/fonts-rs-seven-segment-cheat-sheet",
    "crates/fonts-rs-fourteen-segment",
    "crates/fonts-rs-fourteen-segment-cheat-sheet",
    "crates/fonts-rs-barcode-code39",
    "crates/fonts-rs-barcode-code128",
    "crates/fonts-rs-barcode-ean13",
    "crates/fonts-rs-doto",
    "crates/fonts-rs-doto-cheat-sheet",
    "crates/fonts-rs-redacted",
    "crates/fonts-rs-dicefont",
    "crates/fonts-rs-dicefont-cheat-sheet",
    "crates/fonts-rs-bravura",
    "crates/fonts-rs-bravura-cheat-sheet",
    "crates/fonts-rs-emoji-metadata",
    "crates/fonts-rs-noto-emoji",
    "crates/fonts-rs-noto-emoji-mono",
    "crates/fonts-rs-noto-emoji-color-flags",
    "crates/fonts-rs-noto-emoji-color-noflags",
    "crates/fonts-rs-noto-emoji-bitmap-flags",
    "crates/fonts-rs-noto-emoji-bitmap-noflags",
    "crates/fonts-rs-noto-emoji-glyphs",
    "crates/fonts-rs-noto-emoji-sequences",
    "crates/fonts-rs-noto-emoji-generator",
    "crates/fonts-rs-noto-emoji-cheat-sheet",
    "crates/fonts-rs-blobmoji",
    "crates/fonts-rs-blobmoji-color-flags",
    "crates/fonts-rs-blobmoji-color-noflags",
    "crates/fonts-rs-blobmoji-bitmap-flags",
    "crates/fonts-rs-blobmoji-bitmap-noflags",
    "crates/fonts-rs-blobmoji-glyphs",
    "crates/fonts-rs-blobmoji-sequences",
    "crates/fonts-rs-blobmoji-generator",
    "crates/fonts-rs-blobmoji-cheat-sheet",
    "crates/fonts-rs-cuernavaca",
    "crates/fonts-rs-cuernavaca-cheat-sheet",
    "crates/fonts-rs-eva",
    "crates/fonts-rs-eva-cheat-sheet",
    "crates/fonts-rs-fluent",
    "crates/fonts-rs-fluent-cheat-sheet",
    "crates/fonts-rs-tabler",
    "crates/fonts-rs-tabler-cheat-sheet",
    "crates/fonts-rs-lucide",
    "crates/fonts-rs-lucide-cheat-sheet",
    "crates/fonts-rs-heroicons",
    "crates/fonts-rs-heroicons-cheat-sheet",
    "crates/fonts-rs-line-awesome",
    "crates/fonts-rs-line-awesome-cheat-sheet",
    "crates/nerd-fonts-model",
    "crates/nerd-fonts-generator",
    "crates/nerd-fonts-rs",
    "crates/nerd-fonts-cheat-sheet",
    "crates/fonts-rs-cheat-sheet",
    "crates/fonts-rs-iconset-test",
    "crates/fonts-rs-test",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/fonts-rs"
homepage = "https://github.com/smearor/fonts-rs"
keywords = ["gtk4", "nerd-fonts", "icons", "font", "rendering"]
categories = ["graphics", "gui", "rendering"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(is_lib)'] }

[workspace.dependencies]
# Internal crates
fonts-rs-model = { version = "0.5.0", path = "crates/fonts-rs-model" }
fonts-rs-generator = { version = "0.5.0", path = "crates/fonts-rs-generator" }
fonts-rs-seven-segment = { version = "0.5.0", path = "crates/fonts-rs-seven-segment" }
fonts-rs-fourteen-segment = { version = "0.5.0", path = "crates/fonts-rs-fourteen-segment" }
fonts-rs-barcode-code39 = { version = "0.5.0", path = "crates/fonts-rs-barcode-code39" }
fonts-rs-barcode-code128 = { version = "0.5.0", path = "crates/fonts-rs-barcode-code128" }
fonts-rs-barcode-ean13 = { version = "0.5.0", path = "crates/fonts-rs-barcode-ean13" }
fonts-rs-doto = { version = "0.5.0", path = "crates/fonts-rs-doto" }
fonts-rs-redacted = { version = "0.5.0", path = "crates/fonts-rs-redacted" }
fonts-rs-dicefont = { version = "0.5.0", path = "crates/fonts-rs-dicefont" }
fonts-rs-bravura = { version = "0.5.0", path = "crates/fonts-rs-bravura" }
fonts-rs-emoji-metadata = { version = "0.5.0", path = "crates/fonts-rs-emoji-metadata" }
fonts-rs-noto-emoji = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji" }
fonts-rs-noto-emoji-mono = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-mono" }
fonts-rs-noto-emoji-color-flags = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-color-flags" }
fonts-rs-noto-emoji-color-noflags = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-color-noflags" }
fonts-rs-noto-emoji-bitmap-flags = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-bitmap-flags" }
fonts-rs-noto-emoji-bitmap-noflags = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-bitmap-noflags" }
fonts-rs-noto-emoji-glyphs = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-glyphs" }
fonts-rs-noto-emoji-sequences = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-sequences" }
fonts-rs-noto-emoji-generator = { version = "0.5.0", path = "crates/fonts-rs-noto-emoji-generator" }
fonts-rs-blobmoji = { version = "0.5.0", path = "crates/fonts-rs-blobmoji" }
fonts-rs-blobmoji-color-flags = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-color-flags" }
fonts-rs-blobmoji-color-noflags = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-color-noflags" }
fonts-rs-blobmoji-bitmap-flags = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-bitmap-flags" }
fonts-rs-blobmoji-bitmap-noflags = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-bitmap-noflags" }
fonts-rs-blobmoji-glyphs = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-glyphs" }
fonts-rs-blobmoji-sequences = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-sequences" }
fonts-rs-blobmoji-generator = { version = "0.5.0", path = "crates/fonts-rs-blobmoji-generator" }
fonts-rs-cuernavaca = { version = "0.5.0", path = "crates/fonts-rs-cuernavaca" }
fonts-rs-eva = { version = "0.5.0", path = "crates/fonts-rs-eva" }
fonts-rs-fluent = { version = "0.5.0", path = "crates/fonts-rs-fluent" }
fonts-rs-tabler = { version = "0.5.0", path = "crates/fonts-rs-tabler" }
fonts-rs-lucide = { version = "0.5.0", path = "crates/fonts-rs-lucide" }
fonts-rs-heroicons = { version = "0.5.0", path = "crates/fonts-rs-heroicons" }
fonts-rs-line-awesome = { version = "0.5.0", path = "crates/fonts-rs-line-awesome" }
nerd-fonts-model = { version = "0.5.0", path = "crates/nerd-fonts-model" }
nerd-fonts-generator = { version = "0.5.0", path = "crates/nerd-fonts-generator" }
nerd-fonts-rs = { version = "0.5.0", path = "crates/nerd-fonts-rs" }
fonts-rs-cheat-sheet = { version = "0.5.0", path = "crates/fonts-rs-cheat-sheet" }
fonts-rs-test = { path = "crates/fonts-rs-test" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.3"
quick-xml = { version = "0.42", features = ["serialize"] }

# Compile-time string formatting
const_format = "0.2"

# Error handling
thiserror = "2.0"
miette = "7.6"

# Font parsing
skrifa = "0.48"
read-fonts = "0.45"
font-types = "0.12"
ab_glyph = "0.2"
woff2-patched = "0.4"

# GTK4 ecosystem
gtk4 = "0.11"
gio = "0.22"
glib = "0.22"
glib-build-tools = "0.22"
libadwaita = { version = "0.9", features = ["v1_7"] }
pango = { version = "0.22", features = ["v1_56"] }
pangocairo = "0.22"
tempfile = "3"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Code generation
phf = { version = "0.14", features = ["macros"] }

# Logging
tracing = "0.1"

# Base64 encoding
base64 = "0.23"

# Upstream vendoring (xtask)
toml = "1.1.8"
sha2 = "0.11"
globset = "0.4"
tar = "0.4"
flate2 = "1"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
