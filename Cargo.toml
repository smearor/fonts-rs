[workspace]
members = [
    "crates/nerd-fonts-model",
    "crates/nerd-fonts-generator",
    "crates/nerd-fonts-rs",
    "crates/nerd-fonts-cheat-sheet",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Andreas Schaeffer <hanack@nooblounge.net>"]
repository = "https://github.com/smearor/nerd-fonts-gtk"
homepage = "https://github.com/smearor/nerd-fonts-gtk"
keywords = ["gtk4", "nerd-fonts", "icons", "font", "rendering"]
categories = ["graphics", "gui", "rendering"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(is_lib)'] }
