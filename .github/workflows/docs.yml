name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - "crates/**/*.rs"
      - "crates/*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "crates/**/*.rs"
      - "crates/*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"

env:
  CARGO_TERM_COLOR: always
  APT_PACKAGES: curl build-essential pkg-config libgtk-4-dev libglib2.0-dev libadwaita-1-dev

permissions:
  contents: write

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo doc
        run: |
          # --all-features on fonts-rs would unify every emoji variant
          # feature at once (compile_error! guards); the facade is
          # documented separately with `all`+`gui`.
          cargo doc --workspace --exclude fonts-rs --exclude fonts-rs-noto-emoji --exclude fonts-rs-blobmoji --no-deps --all-features --document-private-items --verbose
          cargo doc -p fonts-rs --no-deps --features "all gui" --document-private-items --verbose
          cargo doc -p fonts-rs-noto-emoji --no-deps --features gtk,render,embed-fonts,metadata --document-private-items --verbose
          cargo doc -p fonts-rs-blobmoji --no-deps --features gtk,render,embed-fonts,metadata --document-private-items --verbose
      - name: Run doctests
        run: |
          # --all-features on fonts-rs would unify every emoji variant
          # feature at once (compile_error! guards); the facade's
          # doctests run with `all`.
          cargo test --workspace --exclude fonts-rs --exclude fonts-rs-noto-emoji --exclude fonts-rs-blobmoji --doc --all-features --verbose
          cargo test -p fonts-rs --doc --features all --verbose
          cargo test -p fonts-rs-noto-emoji --doc --features gtk,render,embed-fonts,metadata --verbose
          cargo test -p fonts-rs-blobmoji --doc --features gtk,render,embed-fonts,metadata --verbose
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          destination_dir: docs
