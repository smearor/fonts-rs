name: Upstream drift check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Report upstream drift
        run: cargo xtask check
      - name: Report upstream drift (JSON)
        run: cargo xtask check --json
