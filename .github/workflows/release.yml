name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  APT_PACKAGES: curl build-essential pkg-config libgtk-4-dev libglib2.0-dev

permissions:
  contents: write

jobs:
  release:
    name: Publish to crates.io
    runs-on: ubuntu-26.04
    steps:
      - name: VCS Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build (Release Mode)
        run: cargo build --workspace --release --all-features --verbose
      # Tier 1: Foundation
      - name: Dry-run publish (fonts-rs-model)
        run: cargo publish --dry-run --locked -p fonts-rs-model --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-model
        run: cargo publish --locked -p fonts-rs-model --token ${{ secrets.CRATES_IO_TOKEN }}
      # Tier 2: Core framework
      - name: Publish fonts-rs-generator
        run: cargo publish --locked -p fonts-rs-generator --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish nerd-fonts-model
        run: cargo publish --locked -p nerd-fonts-model --token ${{ secrets.CRATES_IO_TOKEN }}
      # Tier 3: Font families + generators
      - name: Publish fonts-rs-seven-segment
        run: cargo publish --locked -p fonts-rs-seven-segment --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-fourteen-segment
        run: cargo publish --locked -p fonts-rs-fourteen-segment --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-barcode-code39
        run: cargo publish --locked -p fonts-rs-barcode-code39 --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-barcode-code128
        run: cargo publish --locked -p fonts-rs-barcode-code128 --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-barcode-ean13
        run: cargo publish --locked -p fonts-rs-barcode-ean13 --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-doto
        run: cargo publish --locked -p fonts-rs-doto --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-redacted
        run: cargo publish --locked -p fonts-rs-redacted --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-dicefont
        run: cargo publish --locked -p fonts-rs-dicefont --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-bravura
        run: cargo publish --locked -p fonts-rs-bravura --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-cuernavaca
        run: cargo publish --locked -p fonts-rs-cuernavaca --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish fonts-rs-noto-emoji-generator
        run: cargo publish --locked -p fonts-rs-noto-emoji-generator --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish nerd-fonts-generator
        run: cargo publish --locked -p nerd-fonts-generator --token ${{ secrets.CRATES_IO_TOKEN }}
      # Tier 4: Composite crates
      - name: Publish fonts-rs-noto-emoji
        run: cargo publish --locked -p fonts-rs-noto-emoji --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish nerd-fonts-rs
        run: cargo publish --locked -p nerd-fonts-rs --token ${{ secrets.CRATES_IO_TOKEN }}
      # Tier 5: Application crates
      - name: Publish fonts-rs-noto-emoji-cheat-sheet
        run: cargo publish --locked -p fonts-rs-noto-emoji-cheat-sheet --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish nerd-fonts-cheat-sheet
        run: cargo publish --locked -p nerd-fonts-cheat-sheet --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
