[package]
name = "fonts-rs-noto-emoji"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Noto Emoji font integration for GTK 4 and pixel-drawing"
publish = true

# Noto Emoji is licensed under the SIL Open Font License (OFL-1.1).
license-file = "resources/OFL.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/*.ttf",
    "resources/**/*.json",
    "resources/**/*.txt",
    "resources/OFL.txt",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio", "fonts-rs-generator/gtk"]
render = ["dep:ab_glyph", "fonts-rs-model/render"]
embed-fonts = []

# Each feature selects one TTF variant:
#   mono (NotoEmoji-Regular) or color (COLRv1) / bitmap (CBDT) x flags
# If none is active, build.rs defaults to `color-flags`.
# `renderable` is a marker for variants with visible ab_glyph output
# (mono silhouettes, bitmap color) — don't enable it directly.
renderable = []
mono = ["renderable"]
color-flags = []
color-noflags = []
bitmap-flags = ["renderable"]
bitmap-noflags = ["renderable"]

# Emoji metadata: keywords and categories for search functionality
metadata = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
const_format.workspace = true
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
fonts-rs-noto-emoji-generator.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
fonts-rs-test = { workspace = true, features = ["gtk", "render"] }
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true

[[example]]
name = "gtk_icon_theme"
required-features = ["gtk"]

[[example]]
name = "svg_gresource"
required-features = ["gtk"]

[[example]]
name = "svg_html"
required-features = ["gtk"]

[[example]]
name = "composed_svg_text"
required-features = ["gtk"]

[[example]]
name = "css_class_html"
required-features = ["gtk"]

[[example]]
name = "gtk_gresource"
required-features = ["gtk"]

[[example]]
name = "system_font_fallback"
required-features = ["gtk"]

[[example]]
name = "embed_fonts_render"
required-features = ["gtk", "render", "embed-fonts", "renderable"]
