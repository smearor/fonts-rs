[package]
name = "fonts-rs-noto-emoji"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Noto Emoji font integration for GTK 4 and pixel-drawing"
publish = true

# Noto Emoji is licensed under the SIL Open Font License (OFL-1.1).
license-file = "resources/OFL.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/*.ttf",
    "resources/*.json",
    "resources/*.txt",
    "resources/OFL.txt",
    "resources/icons.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio"]
render = ["dep:ab_glyph"]
embed-fonts = []

# Emoji metadata: keywords and categories for search functionality
metadata = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
fonts-rs-noto-emoji-generator.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
