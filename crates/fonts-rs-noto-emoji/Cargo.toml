[package]
name = "fonts-rs-noto-emoji"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Noto Emoji font integration for GTK 4 and pixel-drawing (variant umbrella)"
publish = true
license.workspace = true

include = [
    "src/**/*.rs",
    "README.md",
    "resources/cheat-sheet.png",
    "Cargo.toml",
]

[features]
# Variant selection: each feature enables one variant crate. Exactly
# one variant may be active - lib.rs guards with `compile_error!`.
# `color-flags` is the default: COLRv1 is vector-based and roughly half
# the size of the CBDT strikes. Select another variant with
# `default-features = false, features = ["<variant>", ...]`.
default = ["gtk", "color-flags"]

mono = ["dep:fonts-rs-noto-emoji-mono"]
color-flags = ["dep:fonts-rs-noto-emoji-color-flags"]
color-noflags = ["dep:fonts-rs-noto-emoji-color-noflags"]
bitmap-flags = ["dep:fonts-rs-noto-emoji-bitmap-flags"]
bitmap-noflags = ["dep:fonts-rs-noto-emoji-bitmap-noflags"]

# Forwarded to whichever variant crate is active (weak deps - no-op
# when the variant feature is off).
gtk = [
    "fonts-rs-noto-emoji-mono?/gtk",
    "fonts-rs-noto-emoji-color-flags?/gtk",
    "fonts-rs-noto-emoji-color-noflags?/gtk",
    "fonts-rs-noto-emoji-bitmap-flags?/gtk",
    "fonts-rs-noto-emoji-bitmap-noflags?/gtk",
]
render = [
    "fonts-rs-noto-emoji-mono?/render",
    "fonts-rs-noto-emoji-color-flags?/render",
    "fonts-rs-noto-emoji-color-noflags?/render",
    "fonts-rs-noto-emoji-bitmap-flags?/render",
    "fonts-rs-noto-emoji-bitmap-noflags?/render",
]
embed-fonts = [
    "fonts-rs-noto-emoji-mono?/embed-fonts",
    "fonts-rs-noto-emoji-color-flags?/embed-fonts",
    "fonts-rs-noto-emoji-color-noflags?/embed-fonts",
    "fonts-rs-noto-emoji-bitmap-flags?/embed-fonts",
    "fonts-rs-noto-emoji-bitmap-noflags?/embed-fonts",
]

# Emoji metadata: keywords and categories for search functionality
metadata = [
    "fonts-rs-noto-emoji-mono?/metadata",
    "fonts-rs-noto-emoji-color-flags?/metadata",
    "fonts-rs-noto-emoji-color-noflags?/metadata",
    "fonts-rs-noto-emoji-bitmap-flags?/metadata",
    "fonts-rs-noto-emoji-bitmap-noflags?/metadata",
]

[dependencies]
fonts-rs-noto-emoji-mono = { workspace = true, optional = true }
fonts-rs-noto-emoji-color-flags = { workspace = true, optional = true }
fonts-rs-noto-emoji-color-noflags = { workspace = true, optional = true }
fonts-rs-noto-emoji-bitmap-flags = { workspace = true, optional = true }
fonts-rs-noto-emoji-bitmap-noflags = { workspace = true, optional = true }

[lints]
workspace = true
