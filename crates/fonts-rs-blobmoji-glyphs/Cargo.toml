[package]
name = "fonts-rs-blobmoji-glyphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Blobmoji single-codepoint SVG artwork (build resource)"
publish = true

# Emits the vendored resource directory to dependent build scripts via
# DEP_BLOBMOJI_GLYPHS_* environment variables.
links = "blobmoji_glyphs"

# Blobmoji is licensed under the SIL Open Font License (OFL-1.1).
license-file = "resources/OFL.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/svg/**/*.svg",
    "resources/OFL.txt",
    "README.md",
    "Cargo.toml",
]

[dependencies]
