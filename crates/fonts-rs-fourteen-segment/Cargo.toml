[package]
name = "fonts-rs-fourteen-segment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DSEG14 fourteen-segment display font integration for GTK 4 and pixel-drawing"
publish = true

# DSEG font is licensed under the SIL Open Font License (OFL-1.1).
# The crate code itself is MIT (inherited from the workspace).
# license-file bundles the OFL text required for font redistribution.
license-file = "resources/DSEG14Classic-LICENSE.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "examples/*.rs",
    "resources/*.ttf",
    "resources/DSEG14Classic-LICENSE.txt",
    "resources/icons.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]

# Each feature selects one DSEG14 variant (style + weight).
# If none is active, build.rs defaults to `classic-regular`.
classic-regular = []
classic-bold = []
classic-italic = []
classic-bold-italic = []
classic-light = []
classic-light-italic = []

classic-mini-regular = []
classic-mini-bold = []
classic-mini-italic = []
classic-mini-bold-italic = []
classic-mini-light = []
classic-mini-light-italic = []

modern-regular = []
modern-bold = []
modern-italic = []
modern-bold-italic = []
modern-light = []
modern-light-italic = []

modern-mini-regular = []
modern-mini-bold = []
modern-mini-italic = []
modern-mini-bold-italic = []
modern-mini-light = []
modern-mini-light-italic = []

gtk = ["dep:gtk4", "dep:gio"]
render = ["dep:ab_glyph"]
embed-fonts = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
const_format.workspace = true
miette.workspace = true

[lints]
workspace = true

[dev-dependencies]
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true

[[example]]
name = "interactive_demo"
required-features = ["gtk", "embed-fonts"]

[[example]]
name = "segment_marquee"
required-features = ["gtk", "embed-fonts"]
