# Upstream sourcing manifest for fonts-rs-fluent
# Consumed by `cargo xtask sync/check/verify`.

[upstream]
repo = "microsoft/fluentui-system-icons"
ref = "a563cf9166f4f91aa617557ed272612b7f0a2f72"  # release 1.1.343 (2026-09-25); no version tags upstream - pin by SHA

[upstream.license]
source = "LICENSE"
target = "resources/LICENSE"

# 24px slices: `assets/<Name>/SVG/` holds the default variant; nested
# `assets/<Name>/<locale>/SVG/` dirs carry localized/RTL alternates
# which we deliberately do not vendor. The single-level `*/SVG/` glob
# selects only the default; files are flattened into the target dir.
[[artifacts]]
source = "assets"
target = "resources/svg/regular-24"
pattern = "*/SVG/ic_fluent_*_24_regular.svg"

[[artifacts]]
source = "assets"
target = "resources/svg/filled-24"
pattern = "*/SVG/ic_fluent_*_24_filled.svg"

[[artifacts]]
source = "fonts/FluentSystemIcons-Regular.ttf"
target = "resources/fonts/FluentSystemIcons-Regular.ttf"

[[artifacts]]
source = "fonts/FluentSystemIcons-Filled.ttf"
target = "resources/fonts/FluentSystemIcons-Filled.ttf"

# Upstream name->codepoint maps (1:1 with the TTF cmaps).
[[artifacts]]
source = "fonts/FluentSystemIcons-Regular.json"
target = "resources/metadata/FluentSystemIcons-Regular.json"

[[artifacts]]
source = "fonts/FluentSystemIcons-Filled.json"
target = "resources/metadata/FluentSystemIcons-Filled.json"

# Derived metadata from @iconify-json/fluent (unpkg, MIT): fluent
# ships aliases for multiple sizes; only 24px variants are vendored,
# so aliases for other sizes and aliases onto hidden icons are dropped.
[[metadata]]
provider = "iconify_aliases"
output = "resources/metadata/aliases.json"
with.iconify_set = "fluent"
with.suffixes = ["-24-regular", "-24-filled"]

# resources/metadata/hidden.json is a curated exclusion list (see the
# `exclude` keys above) - hand-maintained, not generated.
