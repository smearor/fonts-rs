[package]
name = "fonts-rs-fluent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fluent UI System Icons integration for GTK 4 - hybrid TTF + SVG icon set"
publish = true

# Emits the vendored SVG directory to dependent build scripts via
# DEP_FLUENT_* environment variables.
links = "fluent"

# Fluent UI System Icons are licensed under the MIT License.
license-file = "resources/LICENSE"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/**/*.ttf",
    "resources/**/*.json",
    "resources/**/*.svg",
    "resources/LICENSE",
    "upstream.toml",
    "upstream.lock",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio", "fonts-rs-generator/gtk"]
render = ["dep:ab_glyph", "fonts-rs-model/render"]
embed-fonts = []

# Icon metadata: filename-derived keywords, style categories and
# iconify aliases, exposed via `metadata::FluentMetadata` (GlyphMetadata).
metadata = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
const_format.workspace = true
phf.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
const_format.workspace = true
miette.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[example]]
name = "gtk_icon_theme"
required-features = ["gtk"]

[[example]]
name = "svg_gresource"
required-features = ["gtk"]

[[example]]
name = "svg_html"
required-features = ["gtk"]

[[example]]
name = "composed_svg_text"
required-features = ["gtk"]

[[example]]
name = "gtk_gresource"
required-features = ["gtk"]

[[example]]
name = "system_font_fallback"
required-features = ["gtk"]

[[example]]
name = "embed_fonts_render"
required-features = ["gtk", "render", "embed-fonts"]

[[example]]
name = "css_class_html"
required-features = ["gtk"]

[dev-dependencies]
fonts-rs-test = { workspace = true, features = ["gtk", "render"] }
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true
