[package]
name = "fonts-rs-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared example utilities for fonts-rs font family crates"
publish = false

[features]
gtk = ["dep:gtk4", "dep:gio", "dep:base64", "fonts-rs-model/gtk"]
render = ["dep:ab_glyph", "fonts-rs-model/render"]

[dependencies]
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true, features = ["v4_12"] }
ab_glyph = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
miette.workspace = true
pango.workspace = true

[lints]
workspace = true
