[package]
name = "fonts-rs-barcode-code128"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Libre Barcode Code 128 font integration for GTK 4 and pixel-drawing"
publish = true

# Libre Barcode fonts are licensed under the SIL Open Font License (OFL-1.1).
# The crate code itself is MIT (inherited from the workspace).
license-file = "resources/LICENSE.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "examples/*.rs",
    "resources/*.ttf",
    "resources/font.gresource.xml",
    "resources/LICENSE.txt",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio", "fonts-rs-generator/gtk"]
render = ["dep:ab_glyph"]
embed-fonts = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
const_format.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
const_format.workspace = true

[lints]
workspace = true

[dev-dependencies]
fonts-rs-test = { workspace = true, features = ["gtk", "render"] }
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true
pango.workspace = true

[[example]]
name = "barcode_code128_demo"
required-features = ["gtk"]

[[example]]
name = "gtk_icon_theme"
required-features = ["gtk"]

[[example]]
name = "svg_gresource"
required-features = ["gtk"]

[[example]]
name = "svg_html"
required-features = ["gtk"]

[[example]]
name = "composed_svg_text"
required-features = ["gtk"]

[[example]]
name = "css_class_html"
required-features = ["gtk"]

[[example]]
name = "gtk_gresource"
required-features = ["gtk"]

[[example]]
name = "system_font_fallback"
required-features = ["gtk"]

[[example]]
name = "embed_fonts_render"
required-features = ["gtk", "render", "embed-fonts"]
