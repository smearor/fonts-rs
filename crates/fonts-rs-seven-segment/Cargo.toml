[package]
name = "fonts-rs-seven-segment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DSEG7 Classic seven-segment display font integration for GTK 4 and pixel-drawing"
publish = true

# DSEG font is licensed under the SIL Open Font License (OFL-1.1).
# The crate code itself is MIT (inherited from the workspace).
# license-file bundles the OFL text required for font redistribution.
license-file = "resources/DSEG7Classic-LICENSE.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/DSEG7Classic-Regular.ttf",
    "resources/DSEG7Classic-LICENSE.txt",
    "resources/icons.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]
gtk = ["dep:gtk4", "dep:gio"]
render = ["dep:ab_glyph"]
embed-fonts = []

[dependencies]
const_format.workspace = true
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true

[build-dependencies]
const_format.workspace = true
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
glib-build-tools.workspace = true
miette.workspace = true
serde_json.workspace = true

[lints]
workspace = true
