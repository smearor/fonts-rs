# Upstream sourcing manifest for fonts-rs-noto-emoji-color-flags
# Consumed by `cargo xtask sync/check/verify`.
#
# [upstream]: googlefonts/noto-emoji, pinned to the commit that
# shipped the vendored font v2.057 build (main drifts).
# SVG artwork and metadata live in fonts-rs-noto-emoji-glyphs /
# fonts-rs-noto-emoji-sequences.
#
# resources/OFL.txt is the canonical upstream LICENSE (byte-identical
# to the SIL OFL text upstream ships in 2D/fonts/).

[upstream]
repo = "googlefonts/noto-emoji"
ref = "e20cbc2bbec1926686be9f9bee7d1d2cfa1fea0e"

[upstream.license]
source = "2D/fonts/LICENSE"
target = "resources/OFL.txt"

# COLRv1 color font including flag emoji.
[[artifacts]]
source = "2D/fonts"
target = "resources"
pattern = "Noto-COLRv1.ttf"
