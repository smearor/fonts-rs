[package]
name = "fonts-rs-bravura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bravura SMuFL music notation font integration for GTK 4 and pixel-drawing"
publish = true

# Bravura is licensed under the SIL Open Font License (OFL-1.1).
# The crate code itself is MIT (inherited from the workspace).
# license-file bundles the OFL text required for font redistribution.
license-file = "resources/OFL.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/*.otf",
    "resources/*.json",
    "resources/OFL.txt",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio", "fonts-rs-generator/gtk"]
render = ["dep:ab_glyph", "fonts-rs-model/render"]
embed-fonts = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
const_format.workspace = true
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
const_format.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "wiener_blut"
required-features = ["gtk", "render", "embed-fonts"]

[[example]]
name = "gtk_gresource"
required-features = ["gtk"]

[[example]]
name = "gtk_icon_theme"
required-features = ["gtk"]

[[example]]
name = "svg_gresource"
required-features = ["gtk"]

[[example]]
name = "svg_html"
required-features = ["gtk"]

[[example]]
name = "composed_svg_text"
required-features = ["gtk"]

[[example]]
name = "css_class_html"
required-features = ["gtk"]

[[example]]
name = "system_font_fallback"
required-features = ["gtk"]

[[example]]
name = "embed_fonts_render"
required-features = ["gtk", "render", "embed-fonts"]

[dev-dependencies]
fonts-rs-test = { workspace = true, features = ["gtk", "render"] }
gtk4 = { workspace = true }
glib.workspace = true
miette.workspace = true
ab_glyph.workspace = true
pango.workspace = true
base64.workspace = true

[lints]
workspace = true
