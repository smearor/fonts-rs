[package]
name = "fonts-rs-cuernavaca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Chess Cuernavaca font integration for GTK 4 and pixel-drawing"
publish = true

# Cuernavaca font is licensed under the SIL Open Font License (OFL-1.1).
# The crate code itself is MIT (inherited from the workspace).
license-file = "resources/COPYING.md"

include = [
    "src/**/*.rs",
    "build.rs",
    "examples/*.rs",
    "resources/*.ttf",
    "resources/COPYING.md",
    "resources/icons.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio"]
render = ["dep:ab_glyph"]
embed-fonts = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
miette.workspace = true

[lints]
workspace = true

[dev-dependencies]
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true

[[example]]
name = "chess_board"
required-features = ["gtk", "render", "embed-fonts"]
