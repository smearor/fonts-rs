[package]
name = "fonts-rs-noto-emoji-sequences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Noto Emoji multi-codepoint SVG sequences (ZWJ, flags, modifiers - build resource)"
publish = true

# Emits the vendored resource directory to dependent build scripts via
# DEP_NOTO_EMOJI_SEQUENCES_* environment variables.
links = "noto_emoji_sequences"

# Noto Emoji is licensed under the SIL Open Font License (OFL-1.1).
license-file = "resources/OFL.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/svg/**/*.svg",
    "resources/OFL.txt",
    "README.md",
    "Cargo.toml",
]

[dependencies]
