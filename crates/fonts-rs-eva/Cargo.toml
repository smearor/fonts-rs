[package]
name = "fonts-rs-eva"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Eva Icons font integration for GTK 4 and pixel-drawing"
publish = true

# Eva Icons are licensed under the MIT License.
license-file = "resources/LICENSE"

include = [
    "src/**/*.rs",
    "build.rs",
    "resources/*.ttf",
    "resources/**/*.css",
    "resources/**/*.json",
    "resources/svg/**/*.svg",
    "resources/LICENSE",
    "Cargo.toml",
]

[features]
default = ["gtk"]

gtk = ["dep:gtk4", "dep:gio", "fonts-rs-generator/gtk"]
render = ["dep:ab_glyph", "fonts-rs-model/render"]
embed-fonts = []

# Each feature selects one variant: fill (default) or outline.
# If none is active, build.rs defaults to `fill`.
fill = []
outline = []

# Icon metadata: keywords for search functionality (categories and
# aliases are absent upstream — only keywords are populated)
metadata = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
const_format.workspace = true
phf.workspace = true
tracing.workspace = true

[build-dependencies]
const_format.workspace = true
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
miette.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[example]]
name = "gtk_icon_theme"
required-features = ["gtk"]

[[example]]
name = "svg_gresource"
required-features = ["gtk"]

[[example]]
name = "svg_html"
required-features = ["gtk"]

[[example]]
name = "composed_svg_text"
required-features = ["gtk"]

[[example]]
name = "css_class_html"
required-features = ["gtk"]

[[example]]
name = "gtk_gresource"
required-features = ["gtk"]

[[example]]
name = "system_font_fallback"
required-features = ["gtk"]

[[example]]
name = "embed_fonts_render"
required-features = ["gtk", "render", "embed-fonts"]

[dev-dependencies]
fonts-rs-test = { workspace = true, features = ["gtk", "render"] }
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true
