[package]
name = "nerd-fonts-generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Build-time code generation and icon export for Nerd Fonts"

[dependencies]
nerd-fonts-model = { path = "../nerd-fonts-model" }
ttf-parser = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive"] }

[[bin]]
name = "export_icons"
path = "src/bin/export_icons.rs"

[lints]
workspace = true
