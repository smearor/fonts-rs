[package]
name = "fonts-rs-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Generic model types for font glyph packaging: CodePoint, ResourcePath, GlyphName, GlyphEntry"
publish = true

[features]
gtk = ["dep:gio", "dep:gtk4", "dep:pango", "dep:base64"]
render = ["dep:ab_glyph"]

# Enable GTK 4.12+ APIs (load_from_string for CssProvider)
v4_12 = ["gtk4?/v4_12"]

[dependencies]
phf.workspace = true
serde.workspace = true
thiserror.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
pango = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }

[lints]
workspace = true
