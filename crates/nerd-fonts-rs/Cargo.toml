[package]
name = "nerd-fonts-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared Nerd Font integration for GTK4 projects: icon resolution, font loading, and CSS generation"
publish = true

include = [
    "src/**/*.rs",
    "build.rs",
    "examples/*.rs",
    "resources/NerdFontsSymbolsOnly/*.ttf",
    "resources/NerdFontsSymbolsOnly/LICENSE",
    "resources/JetBrainsMonoNLNerdFont/*.woff2",
    "resources/JetBrainsMonoNLNerdFont/LICENSE",
    "resources/metadata/**/*",
    "resources/metadata/*.json",
    "resources/font-face.css",
    "resources/nerd-fonts.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]

# GTK4 icon name resolution, color application, GResource registration
gtk = ["dep:gtk4", "dep:gio"]

# Enable GTK 4.12+ APIs (load_from_string for CssProvider)
v4_12 = ["gtk4?/v4_12"]

# Software rendering with ab_glyph (pixel buffer, no GTK required)
render = ["dep:ab_glyph", "dep:woff2-patched"]

# Web CSS generation (per-icon codepoint mappings for web instances)
web = []

# Embed font files into the binary via include_bytes!
# Without this feature, fonts are loaded from disk at runtime
embed-fonts = []

# Icon metadata: keywords and categories for search functionality
# Embeds keyword/category data for 10.000+ icons (estimated 200-500 KB)
metadata = []

[dependencies]
nerd-fonts-model = { version = "0.1.0", path = "../nerd-fonts-model" }
gio = { version = "0.22", optional = true }
gtk4 = { version = "0.11", optional = true }
ab_glyph = { version = "0.2", optional = true }
woff2-patched = { version = "0.4", optional = true }
phf = { version = "0.13", features = ["macros"] }
tracing = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
glib = "0.22"
miette = "7.4"

[[example]]
name = "interactive_demo"
required-features = ["gtk", "embed-fonts"]

[build-dependencies]
nerd-fonts-generator = { version = "0.1.0", path = "../nerd-fonts-generator" }
nerd-fonts-model = { version = "0.1.0", path = "../nerd-fonts-model" }
glib-build-tools = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ttf-parser = "0.25"

[lints]
workspace = true
