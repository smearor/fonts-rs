[package]
name = "nerd-fonts-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared Nerd Font integration for GTK4 projects: icon resolution, font loading, and CSS generation"
publish = true

include = [
    "src/**/*.rs",
    "build.rs",
    "examples/*.rs",
    "resources/NerdFontsSymbolsOnly/*.ttf",
    "resources/NerdFontsSymbolsOnly/LICENSE",
    "resources/JetBrainsMonoNLNerdFont/*.woff2",
    "resources/JetBrainsMonoNLNerdFont/LICENSE",
    "resources/metadata/**/*",
    "resources/metadata/*.json",
    "resources/font-face.css",
    "resources/nerd-fonts.gresource.xml",
    "resources/icons.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]

# GTK4 icon name resolution, color application, GResource registration
gtk = ["dep:gtk4", "dep:gio", "pango"]

# Pango font loading via add_font_file (no GTK required)
pango = ["dep:pango", "dep:pangocairo", "dep:tempfile"]

# Enable GTK 4.12+ APIs (load_from_string for CssProvider)
v4_12 = ["gtk4?/v4_12"]

# Software rendering with ab_glyph (pixel buffer, no GTK required)
render = ["dep:ab_glyph", "dep:woff2-patched"]

# Web CSS generation (per-icon codepoint mappings for web instances)
web = []

# Embed font files into the binary via include_bytes!
# Without this feature, fonts are loaded from disk at runtime
embed-fonts = []

# Icon metadata: keywords and categories for search functionality
# Embeds keyword/category data for 10.000+ icons (estimated 200-500 KB)
metadata = []

[dependencies]
nerd-fonts-model.workspace = true
fonts-rs-model.workspace = true
const_format.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
pango = { workspace = true, optional = true }
pangocairo = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
woff2-patched = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true

[[example]]
name = "nerd_fonts_demo"
required-features = ["gtk"]

[build-dependencies]
miette.workspace = true
nerd-fonts-generator.workspace = true
nerd-fonts-model.workspace = true
fonts-rs-generator.workspace = true
glib-build-tools.workspace = true
serde_json.workspace = true

[lints]
workspace = true
