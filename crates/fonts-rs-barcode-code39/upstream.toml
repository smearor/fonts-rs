# Upstream sourcing manifest for fonts-rs-barcode-code39 (see concepts/planned/REPRODUCABLE.md).
# Consumed by `cargo xtask sync/check/verify`.
#
# No [upstream] section: every resource is vendored from a URL.
# Not vendored (curated, no upstream source): resources/.gitignore,
# resources/barcode-code39.png.

# Libre Barcode 39 vendored from the Google Fonts repository,
# pinned to a commit (main drifts). The OFL text is vendored
# under the local name LICENSE.txt.
[[artifacts]]
url = "https://raw.githubusercontent.com/google/fonts/bd8f81ddb5c74d5c8897b36ad88b440266245103/ofl/librebarcode39/LibreBarcode39-Regular.ttf"
target = "resources/LibreBarcode39-Regular.ttf"

[[artifacts]]
url = "https://raw.githubusercontent.com/google/fonts/bd8f81ddb5c74d5c8897b36ad88b440266245103/ofl/librebarcode39/OFL.txt"
target = "resources/LICENSE.txt"
