[package]
name = "fonts-rs-redacted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Redacted placeholder font integration for GTK 4 and pixel-drawing"
publish = true

# Redacted font is licensed under the SIL Open Font License (OFL-1.1).
# The crate code itself is MIT (inherited from the workspace).
license-file = "resources/Redacted-OFL.txt"

include = [
    "src/**/*.rs",
    "build.rs",
    "examples/*.rs",
    "resources/*.ttf",
    "resources/Redacted-OFL.txt",
    "resources/icons.gresource.xml",
    "Cargo.toml",
]

[features]
default = ["gtk"]

# Each feature selects one Redacted variant.
# - Redacted (block bars): single static Regular instance
# - RedactedScript (scribble): Light, Regular, Bold
# If none is active, build.rs defaults to `redacted`.
redacted = []
script-light = []
script-regular = []
script-bold = []

gtk = ["dep:gtk4", "dep:gio"]
render = ["dep:ab_glyph"]
embed-fonts = []

[dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
gio = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
phf.workspace = true
tracing.workspace = true

[build-dependencies]
fonts-rs-generator.workspace = true
fonts-rs-model.workspace = true
miette.workspace = true

[lints]
workspace = true

[dev-dependencies]
gtk4 = { workspace = true, features = ["v4_12"] }
glib.workspace = true
miette.workspace = true

[[example]]
name = "newspaper_wireframe"
required-features = ["gtk", "embed-fonts"]
