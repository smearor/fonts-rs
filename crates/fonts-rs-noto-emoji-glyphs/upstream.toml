# Upstream sourcing manifest for fonts-rs-noto-emoji-glyphs
# Consumed by `cargo xtask sync/check/verify`.
#
# [upstream]: googlefonts/noto-emoji, pinned to the commit that
# shipped the vendored font v2.057 build (main drifts).
#
# Splits `2D/svg` with fonts-rs-noto-emoji-sequences: this crate
# vendors the single-codepoint artwork (emoji_u<hex>.svg without a
# sequence separator) plus all shared CLDR/UTS-#51 metadata.
#
# resources/OFL.txt was previously vendored with CRLF line endings
# from a Google Fonts download; sync now vendors the canonical
# upstream LICENSE (byte-identical to the SIL OFL text upstream
# ships in 2D/fonts/).

[upstream]
repo = "googlefonts/noto-emoji"
ref = "e20cbc2bbec1926686be9f9bee7d1d2cfa1fea0e"

[upstream.license]
source = "2D/fonts/LICENSE"
target = "resources/OFL.txt"

# Single-codepoint emoji SVG artwork (emoji_u<hex>.svg).
[[artifacts]]
source = "2D/svg"
target = "resources/svg"
pattern = "emoji_u*.svg"
exclude = ["emoji_u*_*"]

# Emoji 17.0 keyboard/display test data (UTS #51).
[[artifacts]]
url = "https://www.unicode.org/Public/17.0.0/emoji/emoji-test.txt"
target = "resources/metadata/emoji-test.txt"

# CLDR 48 annotations (English names + keywords).
[[artifacts]]
url = "https://raw.githubusercontent.com/unicode-org/cldr-json/4d06be52b51bb2f75688d0abe55c52a66afed790/cldr-json/cldr-annotations-full/annotations/en/annotations.json"
target = "resources/metadata/annotations.json"

# CLDR 48 derived annotations (multi-codepoint sequences).
[[artifacts]]
url = "https://raw.githubusercontent.com/unicode-org/cldr-json/4d06be52b51bb2f75688d0abe55c52a66afed790/cldr-json/cldr-annotations-derived-full/annotationsDerived/en/annotations.json"
target = "resources/metadata/annotations-derived.json"

# Emoji 17.0 picker ordering/shortcodes (googlefonts/emoji-metadata).
[[artifacts]]
url = "https://raw.githubusercontent.com/googlefonts/emoji-metadata/173b9b26e8fcbcbe64e1ecbf073a21a96b95c6b1/emoji_17_0_ordering.json"
target = "resources/metadata/emoji_17_0_ordering.json"
